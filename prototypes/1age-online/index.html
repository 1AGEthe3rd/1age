<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070d"><meta name="robots" content="noindex"><title>1AGE Online · Multiplayer Command Center</title><link rel="icon" href="../../favicon-brand.svg"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#e5f4ff;font:15px system-ui}#scene{position:absolute;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%}button,a{color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #b0ecff;outline-offset:3px}#actions{position:fixed;z-index:50;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 12px);transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:4px 7px;background:#122231d9;border:1px solid #92c3da80;border-radius:40px;box-shadow:0 4px 20px #0008}#actions button{width:36px;height:36px;border:1px solid #a8d9ec66;border-radius:50%;background:#243849;color:#e2f4ff;display:grid;place-items:center;padding:0}#actions button.brand{width:47px;height:47px;background:#101f2e;border-color:#a1e5ff;box-shadow:0 0 14px #65c9ff44}#actions img{width:36px;height:36px;object-fit:contain}#actions svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}body #oneage-controller .oneage-stick{width:clamp(64px,12vmin,106px);height:clamp(64px,12vmin,106px);bottom:max(14px,env(safe-area-inset-bottom));background:#14243377;border:1px solid #a6d5ea99}body #oneage-controller .oneage-stick:first-child{left:max(10px,env(safe-area-inset-left))}body #oneage-controller .oneage-stick:nth-child(2){right:max(10px,env(safe-area-inset-right))}body #oneage-controller .oneage-knob{background:#bbdef025;border:1px solid #abd5eb99;font-size:0}dialog{background:#101d2bf2;color:#e7f5ff;border:1px solid #91c9df88;border-radius:18px;padding:22px;width:min(360px,90vw);max-height:80vh}dialog::backdrop{background:#03070bb0}dialog a,dialog button,dialog select{display:block;width:100%;margin-top:12px;padding:12px;border:1px solid #739bb36b;border-radius:9px;background:#1c3144;color:inherit;text-decoration:none;font:inherit}dialog h2{margin-top:0;font-size:18px}#status{position:fixed;top:env(safe-area-inset-top);left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:0 0 10px 10px;background:#08121ac9;font-size:12px;pointer-events:none;max-width:90%;text-align:center}#status:empty{display:none}@media(max-width:360px){#actions{gap:3px;padding:3px}#actions button{width:32px;height:32px}#actions button.brand{width:42px;height:42px}} 
dialog{overflow:auto;overscroll-behavior:contain}dialog [hidden]{display:none!important}.mission-card{padding:12px;margin:10px 0;background:#0b1824;border:1px solid #739bb36b;border-radius:12px}.mission-card p{font-size:13px;margin:8px 0}.mission-card a,.mission-card button{font-size:13px}dialog button:disabled{opacity:.55}dialog p{line-height:1.45}
dialog input,dialog textarea{display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:10px;background:#091724;color:inherit;border:1px solid #739bb3;border-radius:8px}dialog img{max-width:100%;max-height:240px;object-fit:contain}</style></head><body><main id="scene" aria-label="Walkable Online multiplayer command center"></main><div id="status" role="status">Loading Online center…</div><nav id="actions" aria-label="Spatial controls"><button id="interact" aria-label="Interact with nearest station"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="8"/></svg></button><button class="brand" id="menu" aria-label="1AGE menu"><img src="../../assets/1age-logo.svg" alt="1AGE"></button><button id="reset" aria-label="Return to arrival point"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-6v-6h-4v6H4z"/></svg></button></nav><dialog id="panel" aria-labelledby="panel-title"><h2 id="panel-title"></h2><div id="panel-body"></div><form method="dialog"><button>Close</button></form></dialog><noscript>JavaScript is required for this prototype. <a href="https://1age.com/">Return to 1AGE</a></noscript><script type="module" src="./center.mjs"></script></body></html>
