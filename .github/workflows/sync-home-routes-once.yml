name: Regenerate canonical app homepages once

on:
  push:
    branches:
      - feature/publish-independent-world-domains
    paths:
      - .github/workflows/sync-home-routes-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild all app homepages using updated canonical 1age.com layout
        run: python3 scripts/build-app-homes.py
      - name: Save generated pages on the same release branch
        run: |
          git config user.name "1AGE Homepage Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add home/
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate 3D app homepages after external domain link updates"
            git push origin HEAD:feature/publish-independent-world-domains
          fi
