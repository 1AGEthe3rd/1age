    const axis=stick.dataset.axis;
    const knob=stick.querySelector('.nlc-knob');
    let owner=null;

    function update(e){
        const r=stick.getBoundingClientRect();
        const radius=r.width*.34;
        let x=(e.clientX-r.left-r.width/2)/radius;
        let y=(e.clientY-r.top-r.height/2)/radius;
        const length=Math.hypot(x,y);

        if(length>1){x/=length;y/=length}

        nlcPad[axis]={x,y};
        knob.style.transform=
            `translate(calc(-50% + ${x*radius}px),calc(-50% + ${y*radius}px))`;
    }

    stick.addEventListener('pointerdown',e=>{
        e.preventDefault();
        if(owner!==null)return;
        owner=e.pointerId;
        stick.setPointerCapture(owner);
        update(e);
    });

    stick.addEventListener('pointermove',e=>{
        if(owner===e.pointerId)update(e);
    });

    function release(e){
        if(owner!==e.pointerId)return;
        owner=null;
        nlcPad[axis]={x:0,y:0};
        knob.style.transform='translate(-50%,-50%)';
    }

    for(const event of ['pointerup','pointercancel','lostpointercapture']){
        stick.addEventListener(event,release);
    }
}

function nlcReadControls(dt){
    let mx=nlcPad.move.x;
    let my=nlcPad.move.y;
    let lx=nlcPad.look.x;
    let ly=nlcPad.look.y;
    let interact=!!nlcPad.buttons.A || !!nlcPad.buttons.X;
    let sprint=!!nlcPad.buttons.B;

    const pad=[...(navigator.getGamepads?.()||[])]
        .find(p=>p&&p.connected&&p.mapping==='standard');

    if(pad){
        const dead=v=>Math.abs(v)<.18?0:v;
        mx+=dead(pad.axes[0]||0);
        my+=dead(pad.axes[1]||0);
        lx+=dead(pad.axes[2]||0);
        ly+=dead(pad.axes[3]||0);
        interact=interact||!!pad.buttons[0]?.pressed;
        sprint=sprint||!!pad.buttons[1]?.pressed;
    }

    const status=document.getElementById('nlcControllerStatus');
    const statusText=pad
        ?'🎮 Controller connected'
        :'🎮 Controller: not connected';
    if(status.textContent!==statusText)
        status.textContent=statusText;

    const options=!!pad?.buttons[9]?.pressed;
    const cancel=!!pad?.buttons[1]?.pressed ||
                 !!nlcPad.buttons.B;

    if(options&&!nlcPad.previousOptions)
        nlcMenuButton.click();

    if(cancel&&!nlcPad.previousCancel&&panelOpen)
        document.getElementById('close').click();

    nlcPad.previousOptions=options;
    nlcPad.previousCancel=cancel;

    mx=Math.max(-1,Math.min(1,mx));
    my=Math.max(-1,Math.min(1,my));
    lx=Math.max(-1,Math.min(1,lx));
    ly=Math.max(-1,Math.min(1,ly));

    if(!panelOpen){
        yaw-=lx*dt*2.2;
        pitch=Math.max(-1.25,Math.min(1.25,pitch-ly*dt*2.2));
    }

    if(interact&&!nlcPad.previousX&&!panelOpen){
        nlcInteractNow();
    }

    nlcPad.previousX=interact;

    return {
        forward:-my,
        side:mx,
        sprint
    };
}
