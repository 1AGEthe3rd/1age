<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NLC Café Audio Preview</title><style>body{background:#000;color:white;font:700 22px system-ui;padding:8vw}h1{color:#1bfd9c}#state{border:2px solid #1bfd9c;border-radius:25px;padding:35px;font-size:clamp(28px,5vw,54px)}p{font-size:18px;line-height:1.5}</style></head><body><h1>☕ NORTHLEFTCHEF / CAFÉ</h1><div id="state">📻 RADIO MODE</div><p id="detail">Default café audio state. Connect a radio source in a later build.</p><p>This prototype previews the café's audio-source switching. It does not transmit music.</p><script>const c=new BroadcastChannel('nlc-cafe-008');c.onmessage=e=>{if(e.data.type==='dj-on'){document.getElementById('state').textContent='🎧 LIVE DJ MODE';document.getElementById('detail').textContent='Local DJ booth has taken over the café audio status.'}if(e.data.type==='dj-off'){document.getElementById('state').textContent='📻 RADIO MODE';document.getElementById('detail').textContent='DJ ended. Café returned to default radio status.'}};</script></body></html>
