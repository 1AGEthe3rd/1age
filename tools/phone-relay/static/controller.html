<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>1AGE · Phone Controller</title>
<style>
:root{color-scheme:dark;--green:#1bfd9c}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#e2ffdc;font:16px system-ui}button,input{font:inherit}button{cursor:pointer}#pairing{max-width:420px;margin:6vh auto;padding:28px}h1{color:var(--green);font-size:28px}p{line-height:1.5}input{width:100%;padding:16px;border:1px solid var(--green);background:#09120c;border-radius:12px;font-size:26px;letter-spacing:8px;color:#fff}#connect{margin-top:16px;width:100%;padding:15px;background:var(--green);border:0;border-radius:24px;color:#000;font-weight:700}#error{color:#ffb7ba}#pad{height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:none;user-select:none;-webkit-user-select:none;background:radial-gradient(ellipse at 50% 100%,#10392d,transparent 70%)}header{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));right:max(20px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;font-size:13px}strong{color:var(--green)}.stick{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));width:clamp(120px,25vh,190px);height:clamp(120px,25vh,190px);border:2px solid var(--green);border-radius:50%;background:#06100de8;display:grid;place-items:center;touch-action:none}#left{left:max(22px,env(safe-area-inset-left))}#right{right:max(22px,env(safe-area-inset-right))}.thumb{pointer-events:none;width:55%;height:55%;border:2px solid var(--green);border-radius:50%;background:#0c231d;display:grid;place-items:center;font-size:26px;color:var(--green);will-change:transform}#actions{position:absolute;right:clamp(160px,30vh,240px);bottom:max(28px,env(safe-area-inset-bottom));width:150px;height:150px}.action{position:absolute;width:48px;height:48px;border:2px solid var(--color,var(--green));border-radius:50%;color:var(--color,var(--green));background:#07100f;font-size:20px;touch-action:none}.action.held{background:var(--color,var(--green));color:#000}#A{left:51px;bottom:0}#B{right:0;top:51px;--color:#ff8fce}#X{left:0;top:51px;--color:#55b8ff}#Y{left:51px;top:0;--color:#ffbb55}.native-action{position:static;width:auto;height:36px;padding:0 12px;border-radius:22px;font-size:13px}#Menu{position:static;width:auto;height:36px;padding:0 16px;border-radius:22px;font-size:13px}#guide{position:absolute;bottom:8px;left:27%;right:27%;text-align:center;font-size:11px;color:#aac3b4;pointer-events:none}#rotate{display:none}#disconnect{position:absolute;top:64px;left:0;right:0;text-align:center;color:#ffb7ba;font-size:14px}
@media(orientation:portrait){#rotate{display:block;position:absolute;top:25%;width:100%;text-align:center;color:var(--green)}#actions{bottom:38%;right:calc(50% - 75px)}#guide{bottom:28%;left:10%;right:10%}.stick{width:36vw;height:36vw}}
@media(max-height:390px) and (orientation:landscape){#actions{width:132px;height:132px;right:155px}.action{width:42px;height:42px}#A{left:45px}#B,#X{top:45px}#Y{left:45px}.stick{width:125px;height:125px}#guide{bottom:5px}}
/* Build 005.1: explicit control regions keep sticks and actions apart. */
[hidden]{display:none!important}
#pad{--edge-x:max(16px,env(safe-area-inset-right));--edge-y:max(16px,env(safe-area-inset-bottom));--stick:clamp(88px,24dvh,150px);--cluster:clamp(108px,28dvh,138px);--button:calc(var(--cluster) / 3)}
.stick{width:var(--stick);height:var(--stick);bottom:var(--edge-y)}
#left{left:max(16px,env(safe-area-inset-left))}#right{right:var(--edge-x)}
#actions{right:calc(var(--edge-x) + var(--stick) + 20px);bottom:var(--edge-y);width:var(--cluster);height:var(--cluster)}
#actions .action{width:var(--button);height:var(--button)}
#A{left:var(--button);bottom:0;top:auto}#Y{left:var(--button);top:0;bottom:auto}#X{left:0;top:var(--button)}#B{right:0;top:var(--button)}
#guide{top:58px;bottom:auto;left:22%;right:22%;font-size:11px;line-height:1.4}
@media(orientation:portrait){#pad{--stick:min(36vw,160px);--cluster:138px}#actions{right:var(--edge-x);bottom:calc(var(--edge-y) + var(--stick) + 24px)}#guide{top:80px;left:12%;right:12%}#rotate{top:28%}}
</style></head><body>
<main id="pairing"><h1>1AGE Phone Controller</h1><p>Enter the PIN shown on your computer. Keep both devices on the same reachable Wi-Fi network.</p><form id="form"><input id="pin" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" aria-label="Six digit pairing PIN" required><button id="connect">Connect controller</button></form><p id="error" role="alert"></p></main>
<main id="pad" hidden><header><strong>1AGE</strong><span id="status">Connecting…</span><span id="native-controls" hidden><button class="action native-action" data-button="Tool">Tool</button> <button class="action native-action" data-button="Save">Save</button></span><button class="action" id="Menu" data-button="Menu">Menu</button></header><p id="rotate">Rotate your phone for landscape controls</p><div id="disconnect"></div><div class="stick" id="left" aria-label="Movement joystick"><div class="thumb">L</div></div><div class="stick" id="right" aria-label="Camera joystick"><div class="thumb">R</div></div><div id="actions"><button class="action" id="A" data-button="A">A</button><button class="action" id="B" data-button="B">B</button><button class="action" id="X" data-button="X">X</button><button class="action" id="Y" data-button="Y">Y</button></div><div id="guide">L move · R look · A / X interact · B sprint / close · Y reserved</div></main><script src="/static/controller.js"></script></body></html>
