<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>1AGE — Search Solana</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="hero">

            <h1>1AGE</h1>

            <p class="tagline">
                Search the Solana ecosystem.
            </p>

            <form id="search-form" class="search-form">

                <input
                    id="search-input"
                    type="search"
                    placeholder="Search projects, wallets, games, tools..."
                    autocomplete="off"
                >

                <button type="submit">
                    Search
                </button>

            </form>

            <div class="quick-links">
                <button class="quick-search" data-query="wallet">
                    Wallets
                </button>

                <button class="quick-search" data-query="defi">
                    DeFi
                </button>

                <button class="quick-search" data-query="games">
                    Games
                </button>

                <button class="quick-search" data-query="developer">
                    Tools
                </button>
            </div>

        </section>

        <section id="results-section" class="results-section">

            <div class="results-header">
                <p id="results-label">
                    Discover the Solana ecosystem.
                </p>
            </div>

            <div id="results" class="results"></div>

        </section>

    </main>

    <script src="search.js"></script>

</body>
</html>
